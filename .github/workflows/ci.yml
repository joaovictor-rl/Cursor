# Integração contínua: a cada push ou pull request, roda os testes da API
# e confere se o site compila. O Render só publica se os dois passarem.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Testes da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: python -m pytest
        working-directory: backend

  frontend:
    name: Build do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend